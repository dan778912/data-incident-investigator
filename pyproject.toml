[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-incident-investigator"
version = "0.1.0"
description = "A safety-scoped agent that diagnoses and remediates data pipeline incidents."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite==0.22.1",
  "fastapi==0.165.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "langgraph==1.2.24",
  "langgraph-checkpoint-sqlite==3.1.3",
  "openai==3.57.0",
  "pandas==3.1.1",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.34",
  "PyYAML==6.0.4",
  "tenacity==9.2.1",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.1",
  "pandas-stubs==3.1.0.261029",
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.6",
]

[project.scripts]
dii-api = "data_incident_investigator.api.main:run"
dii-eval = "data_incident_investigator.evaluation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_incident_investigator = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["data_incident_investigator"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["data_incident_investigator"]

